# This is an experimental project-level configuration, to see if Stack can be
# built with GHC 10.0.1-alpha2. It can't, not least because hashable requires
# modules exposed by ghc-bignum.
snapshot: nightly-2026-11-14 # GHC 9.12.4
compiler: ghc-10.0.0.20261109
compiler-check: match-exact # Anticipating future alpha or RC releases

extra-deps:
# ghc-10.0.0.20261109 specifies semaphore-compat-2.0.1
- semaphore-compat-1.0.0@sha256:2dff81c2c0ec9bac9f8bae364db497188654d2e1e4330f4a0e2f12310149f3e9,1176
# nightly-2026-11-14 specifies pantry-0.11.4
- pantry-0.11.5@sha256:25e03e65894cca878a33ce6f33bd0e5c7c09c16ddb0442ae24fbb7f0324a8f84,7325
# Patched locally:
- ../../../Haskell/hashable-1.5.1.0
# Patched locally:
- ../../../Haskell/crypton-1.1.5
# Patched locally:
- ../../../Haskell/persistent-sqlite-2.13.3.1

allow-newer: true

allow-newer-deps:
- aeson
- assoc
- async
- attoparsec
- base16
- base64
- bifunctors
- cborg
- data-fix
- generic-deriving
- hackage-security
- hashable
- haskell-src-meta
- hpack
- http-api-data
- indexed-traversable-instances
- integer-conversion
- microlens-th
- path-io
- persistent
- primitive
- ram
- scientific
- semaphore-compat
- semialign
- serialise
- splitmix
- stack
- string-interpolate
- text-iso8601
- text-short
- th-abstraction
- th-compat
- th-expand-syns
- th-lift
- th-orphans
- these
- time-compat
- unordered-containers
- uuid-types
- vault
- vector
- vector-stream

docker:
  enable: false
  repo: quay.io/benz0li/ghc-musl:10.0.1

nix:
  # --nix on the command-line to enable.
  packages:
  - pkg-config
  - zlib

flags:
  stack:
    developer-mode: true
