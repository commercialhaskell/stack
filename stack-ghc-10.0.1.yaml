# This is an experimental project-level configuration, to see if Stack can be
# built with GHC 10.0.1-alpha1. It can't, because hashable requires modules
# exposed by ghc-bignum.
snapshot: nightly-2026-10-28 # GHC 9.12.4
compiler: ghc-10.0.0.20260917
compiler-check: match-exact # Anticipating future alpha or rc releases

extra-deps:
# ghc-10.0.0.20260917 specifies semaphore-compat-2.0.1
- semaphore-compat-1.0.0@sha256:2dff81c2c0ec9bac9f8bae364db497188654d2e1e4330f4a0e2f12310149f3e9,1176

allow-newer: true

allow-newer-deps:
- aeson
- assoc
- async
- attoparsec
- base16
- base64
- bifunctors
- cborg
- data-fix
- generic-deriving
- hackage-security
- hashable
- haskell-src-meta
- hpack
- http-api-data
- indexed-traversable-instances
- integer-conversion
- microlens-th
- pantry
- path-io
- persistent
- primitive
- ram
- scientific
- semaphore-compat
- semialign
- serialise
- splitmix
- stack
- string-interpolate
- text-iso8601
- text-short
- th-abstraction
- th-compat
- th-expand-syns
- th-lift
- th-orphans
- these
- time-compat
- unordered-containers
- uuid-types
- vault
- vector
- vector-stream

docker:
  enable: false
  repo: quay.io/benz0li/ghc-musl:10.0.1

nix:
  # --nix on the command-line to enable.
  packages:
  - pkg-config
  - zlib

flags:
  stack:
    developer-mode: true
