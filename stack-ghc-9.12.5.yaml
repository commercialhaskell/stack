# This is an experimental project-level configuration, to see if Stack can be
# built with GHC 9.12.5-rc3.
snapshot: nightly-2026-11-14 # GHC 9.12.4
compiler: ghc-9.12.4.20260713
compiler-check: match-exact # Anticipating future rc releases

extra-deps:
# ghc-9.12.4.20260713 specifies Cabal-3.14.2.0
- Cabal-3.18.2.0@sha256:12ff223739a4d3223744925112d147354916261c478bde639fb497820f3268d3,13985
- Cabal-syntax-3.18.2.0@sha256:8f7430a41796b2d69b597348999a382442f15d113e48a604ed5369a10bc42a45,7529
# ghc-9.12.4.20260713 specifies semaphore-compat-2.0.0
- semaphore-compat-1.0.0@sha256:2dff81c2c0ec9bac9f8bae364db497188654d2e1e4330f4a0e2f12310149f3e9,1176
# nightly-2026-11-14 specifies pantry-0.11.4
- pantry-0.11.5@sha256:25e03e65894cca878a33ce6f33bd0e5c7c09c16ddb0442ae24fbb7f0324a8f84,7325

allow-newer: true

allow-newer-deps:
- hpack

docker:
  enable: false
  repo: quay.io/benz0li/ghc-musl:9.12.5

nix:
  # --nix on the command-line to enable.
  packages:
  - pkg-config
  - zlib

flags:
  stack:
    developer-mode: true
